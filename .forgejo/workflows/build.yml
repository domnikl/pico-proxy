# Forgejo (git.liebler.dev) is this repository's primary; GitHub is a push mirror
# whose own workflows (.github/workflows, ignored here) keep publishing the public
# multi-arch image to ghcr.io. This one builds the linux/amd64 image the homelab's
# Hetzner cluster pulls from the Forgejo registry.
name: build

on: push

env:
  IMAGE: git.liebler.dev/dominik/pico-proxy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: https://github.com/docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: git.liebler.dev
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Pushes from main only; every other branch just builds.
      - uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
